name: 报告问题
description: 帮助改进封面获取、显示或后台运行。
title: '[问题] '
body:
  - type: markdown
    attributes:
      value: 请提供必要的错误信息。公开分享日志前，请移除个人路径、账号信息和不希望公开的曲目信息。
  - type: input
    id: version
    attributes:
      label: 程序版本
      placeholder: 例如 0.3.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows 与播放器版本
      placeholder: 例如 Windows 11，网易云音乐 3.1.41
    validations:
      required: true
  - type: input
    id: wallpaper
    attributes:
      label: 壁纸编号或链接
      description: 如果是封面显示问题，请提供壁纸信息。
  - type: textarea
    id: behavior
    attributes:
      label: 发生了什么
      description: 简要说明操作步骤、界面状态，以及期望的结果。
    validations:
      required: true
